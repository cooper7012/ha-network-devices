name: Release

# Publishes a GitHub release (e.g. v3.1.0) whenever the version in manifest.json
# doesn't have one yet. HACS / the Marketplace then shows that version number.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create release for the manifest version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(jq -r .version custom_components/network_devices/manifest.json)
          tag="v${version}"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists, nothing to do."
            exit 0
          fi
          gh release create "$tag" --target "$GITHUB_SHA" --title "$tag" --generate-notes --latest
